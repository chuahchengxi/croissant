name: Release

# Push a tag (vX.Y.Z) and CI does the whole release: build, apply the release
# signing policy, optionally notarize when Apple credentials exist, verify, and
# publish the GitHub release with the styled DMG. Releases are NOT cut locally, so
# nothing ever has to enable/disable a workflow. If a run hits a transient
# failure, re-run it with `gh run rerun <run-id>` (or from the Actions tab); no
# need to retag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish DMG
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # v0.2.1 is deliberately ad-hoc, matching the locally tested build.
      # Leave stored credentials untouched for later signed releases.
      SIGNING_CERT_P12: ${{ github.ref_name != 'v0.2.1' && secrets.SIGNING_CERT_P12 || '' }}
      SIGNING_CERT_PASSWORD: ${{ github.ref_name != 'v0.2.1' && secrets.SIGNING_CERT_PASSWORD || '' }}
      NOTARY_API_KEY_P8: ${{ github.ref_name != 'v0.2.1' && secrets.NOTARY_API_KEY_P8 || '' }}
      NOTARY_KEY_ID: ${{ github.ref_name != 'v0.2.1' && secrets.NOTARY_KEY_ID || '' }}
      NOTARY_ISSUER_ID: ${{ github.ref_name != 'v0.2.1' && secrets.NOTARY_ISSUER_ID || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Unit tests already gate this exact commit in CI on main; the release
      # run goes straight to building. With no credentials this remains ad-hoc;
      # configured signing must succeed and never silently downgrade.

      - name: Set up signing
        env:
          REQUIRE_SIGNING: 0
        run: ./Tools/ci-setup-signing.sh

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          # Compare with separators (-, ., space) removed so a tag like vbeta-2
          # matches an app version of "beta 2".
          if [[ "${VERSION//[-. ]/}" != "${APP_VERSION//[-. ]/}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: |
          if [[ -n "$SIGNING_CERT_P12" ]]; then
            ./build.sh
          else
            ./build.sh --force-adhoc
          fi

      - name: Verify release signing policy
        id: signing_policy
        run: |
          SIGNATURE="$(codesign -dv build/stage/Croissaint.app 2>&1)"
          codesign --verify --deep --strict build/stage/Croissaint.app
          if [[ -n "$SIGNING_CERT_P12" ]]; then
            if grep -q 'Signature=adhoc' <<< "$SIGNATURE"; then
              echo "Configured release signing produced an ad-hoc app" >&2
              exit 1
            fi
            if grep -q 'Authority=Developer ID Application:' <<< "$SIGNATURE"; then
              echo "MODE=developer-id" >> "$GITHUB_OUTPUT"
            else
              grep -q 'Authority=Croissaint Utils Signing' <<< "$SIGNATURE"
              echo "MODE=stable" >> "$GITHUB_OUTPUT"
            fi
          else
            grep -q 'Signature=adhoc' <<< "$SIGNATURE"
            echo "MODE=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Selftest
        run: ./build/Croissaint --selftest

      - name: Notarize app
        run: ./Tools/notarize.sh build/stage/Croissaint.app

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Notarize DMG
        run: ./Tools/notarize.sh dist/*.dmg

      - name: Prepare release showcase media
        id: release_files
        run: |
          mkdir -p dist/showcase
          {
            echo "FILES<<__VRSS_FILES__"
            printf '%s\n' dist/*.dmg
            if compgen -G "dist/showcase/*.mp4" > /dev/null; then
              printf '%s\n' dist/showcase/*.mp4
            fi
            echo "__VRSS_FILES__"
          } >> "$GITHUB_OUTPUT"

      - name: Verify notarization
        if: env.NOTARY_API_KEY_P8 != ''
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          xcrun stapler validate "$DMG"
          MP=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MP" >/dev/null 2>&1 || true
            rmdir "$MP" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$DMG"
          spctl -a -t exec -vv "$MP/Croissaint.app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$MP/Croissaint.app"

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION" >&2
            exit 1
          fi
          NOTES="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} /^## \[/&&g{exit} g{print}' CHANGELOG.md)"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md entry for $VERSION is empty" >&2
            exit 1
          fi
          {
            echo "NOTES<<__VRSS_EOF__"
            printf '%s\n' "$NOTES"
            echo ""
            if [[ -n "${NOTARY_API_KEY_P8:-}" ]]; then
              echo "Signed with an Apple Developer ID and notarized by Apple, so it downloads and opens normally. Requires macOS 14 or later. Open the .dmg below and drag Croissaint to Applications."
            elif [[ "${{ steps.signing_policy.outputs.MODE }}" == "developer-id" ]]; then
              echo 'Signed with an Apple Developer ID, but not notarized. macOS may require approval in Privacy & Security. Requires macOS 14 or later.'
            elif [[ "${{ steps.signing_policy.outputs.MODE }}" == "stable" ]]; then
              echo '## Installation and macOS security'
              echo ''
              echo 'This build uses a stable self-signed identity. It is not Apple-notarized, and macOS may block a downloaded copy. No signing identity is required on the installing Mac.'
              echo ''
              echo 'Open the .dmg and drag Croissaint to Applications. If you trust the source and integrity of the app, follow [Apple’s instructions](https://support.apple.com/en-us/102445) when Open Anyway is available. Do not dismiss malware, revoked-authorization, or damaged-app warnings as harmless.'
              echo ''
              echo 'Requires an Apple Silicon Mac running macOS 14 or later.'
            else
              echo '## Installation and macOS security'
              echo ''
              echo 'This build is ad-hoc signed and is not notarized by Apple. No developer account or signing identity is required to install it, but macOS may block a downloaded copy. Accessibility and Screen Recording permissions may need to be granted again after updates.'
              echo ''
              echo 'Open the .dmg and drag Croissaint to Applications. If you trust the source and integrity of the app, follow [Apple’s instructions](https://support.apple.com/en-us/102445) when Open Anyway is available. Do not dismiss malware, revoked-authorization, or damaged-app warnings as harmless.'
              echo ''
              echo 'Alternatively, build from the reviewed source with `./build.sh --force-adhoc --install`. Requires an Apple Silicon Mac running macOS 14 or later.'
            fi
            echo "__VRSS_EOF__"
            if [[ "$VERSION" =~ (beta|rc|alpha) ]]; then
              echo "PRERELEASE=true"
              echo "MAKE_LATEST=false"
            else
              echo "PRERELEASE=false"
              echo "MAKE_LATEST=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: ${{ steps.release_files.outputs.FILES }}
          body: ${{ steps.notes.outputs.NOTES }}
          prerelease: ${{ steps.notes.outputs.PRERELEASE == 'true' }}
          make_latest: ${{ steps.notes.outputs.MAKE_LATEST }}
