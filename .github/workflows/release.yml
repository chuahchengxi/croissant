name: Release

# Push a tag (vX.Y.Z) and CI does the whole release: build, apply the release
# signing policy, optionally notarize when Apple credentials exist, verify, and
# publish the GitHub release with the styled DMG. Releases are NOT cut locally, so
# nothing ever has to enable/disable a workflow. If a run hits a transient
# failure, re-run it with `gh run rerun <run-id>` (or from the Actions tab); no
# need to retag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish DMG
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Mirrored at job scope so any step can branch on whether real signing
      # and notarization will happen.
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Unit tests already gate this exact commit in CI on main; the release
      # run goes straight to building so the tag reaches users faster. 0.1.5
      # is the sole ad-hoc bridge; later tags require the stable signing secret.
      # Apple notarization remains optional and is skipped without its secrets.

      - name: Set up signing
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          # 0.1.5 is the ad-hoc bridge accepted by the updater in 0.1.4.
          # Every later release must use the stable identity so permissions
          # survive after the one deliberate reset in 0.1.6.
          REQUIRE_SIGNING: ${{ github.ref_name == 'v0.1.5' && '0' || '1' }}
        run: ./Tools/ci-setup-signing.sh

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          # Compare with separators (-, ., space) removed so a tag like vbeta-2
          # matches an app version of "beta 2".
          if [[ "${VERSION//[-. ]/}" != "${APP_VERSION//[-. ]/}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: |
          if [[ "$GITHUB_REF_NAME" == "v0.1.5" ]]; then
            ./build.sh --force-adhoc
          else
            ./build.sh --allow-adhoc
          fi

      - name: Verify release signing transition
        id: signing_policy
        run: |
          SIGNATURE="$(codesign -dv build/stage/Croissaint.app 2>&1)"
          if [[ "$GITHUB_REF_NAME" == "v0.1.5" ]]; then
            grep -q 'Signature=adhoc' <<< "$SIGNATURE" || {
              echo "v0.1.5 must be the ad-hoc updater bridge" >&2
              exit 1
            }
            echo "MODE=adhoc" >> "$GITHUB_OUTPUT"
          elif grep -q 'Signature=adhoc' <<< "$SIGNATURE"; then
            echo "$GITHUB_REF_NAME must use the stable release identity" >&2
            exit 1
          else
            echo "MODE=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Selftest
        run: ./build/Croissaint --selftest

      - name: Notarize app
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./Tools/notarize.sh build/stage/Croissaint.app

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Notarize DMG
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./Tools/notarize.sh dist/*.dmg

      - name: Prepare release showcase media
        id: release_files
        run: |
          mkdir -p dist/showcase
          {
            echo "FILES<<__VRSS_FILES__"
            printf '%s\n' dist/*.dmg
            if compgen -G "dist/showcase/*.mp4" > /dev/null; then
              printf '%s\n' dist/showcase/*.mp4
            fi
            echo "__VRSS_FILES__"
          } >> "$GITHUB_OUTPUT"

      - name: Verify notarization
        if: env.NOTARY_API_KEY_P8 != ''
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          xcrun stapler validate "$DMG"
          MP=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MP" >/dev/null 2>&1 || true
            rmdir "$MP" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$DMG"
          spctl -a -t exec -vv "$MP/Croissaint.app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$MP/Croissaint.app"

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION" >&2
            exit 1
          fi
          NOTES="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} /^## \[/&&g{exit} g{print}' CHANGELOG.md)"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md entry for $VERSION is empty" >&2
            exit 1
          fi
          {
            echo "NOTES<<__VRSS_EOF__"
            printf '%s\n' "$NOTES"
            echo ""
            if [[ -n "${NOTARY_API_KEY_P8:-}" ]]; then
              echo "Signed with an Apple Developer ID and notarized by Apple, so it downloads and opens normally. Requires macOS 14 or later. Open the .dmg below and drag Croissaint to Applications."
            elif [[ "${{ steps.signing_policy.outputs.MODE }}" == "stable" ]]; then
              echo '## macOS will say this app is damaged. It is not.'
              echo ''
              echo 'This build uses Croissaint’s stable self-signed identity so Accessibility and Screen Recording grants survive later updates. It is not Apple-notarized, so Gatekeeper still refuses the quarantined download.'
              echo ''
              echo 'Open the .dmg below, drag Croissaint to Applications, then run this once in Terminal:'
              echo ''
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine /Applications/Croissaint.app'
              echo '```'
              echo ''
              echo 'Croissaint opens normally from then on. Requires macOS 14 or later.'
            else
              echo '## macOS will say this app is damaged. It is not.'
              echo ''
              echo 'This build is ad-hoc signed (no notarization credentials configured), so Gatekeeper refuses it and offers only Move to Trash. Right-click then Open does NOT work for ad-hoc code on macOS 15 or later, and no Open Anyway button appears under Privacy & Security.'
              echo ''
              echo 'Open the .dmg below, drag Croissaint to Applications, then run this once in Terminal:'
              echo ''
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine /Applications/Croissaint.app'
              echo '```'
              echo ''
              echo 'Croissaint opens normally from then on. Requires macOS 14 or later.'
            fi
            echo "__VRSS_EOF__"
            if [[ "$VERSION" =~ (beta|rc|alpha) ]]; then
              echo "PRERELEASE=true"
              echo "MAKE_LATEST=false"
            else
              echo "PRERELEASE=false"
              echo "MAKE_LATEST=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: ${{ steps.release_files.outputs.FILES }}
          body: ${{ steps.notes.outputs.NOTES }}
          prerelease: ${{ steps.notes.outputs.PRERELEASE == 'true' }}
          make_latest: ${{ steps.notes.outputs.MAKE_LATEST }}
